<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://lucide.dev/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avi Dwivedi | Creative Developer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
            },
            colors: {
              paper: '#FDFBF7',
              ink: '#1C1917',
              accent: '#F97316', // Orange-500
              'accent-hover': '#EA580C', // Orange-600
              'dark-paper': '#1c1917', // Stone-900
              'dark-card': '#292524', // Stone-800
            },
            animation: {
              'blob': 'blob 7s infinite',
              'marquee': 'marquee 25s linear infinite',
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              },
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-100%)' },
              }
            }
          },
        },
      }
    </script>
    <style>
      :root {
        --shadow-color: #1C1917;
        --border-color: #1C1917;
      }

      html {
        scroll-behavior: smooth;
        /* Ensures the section title isn't hidden behind the fixed navbar when scrolling */
        scroll-padding-top: 100px;
      }

      .dark {
        --shadow-color: #a8a29e; /* Stone 400 */
        --border-color: #ffffff;
      }

      /* Transitions */
      body {
        transition-property: color, background-color, border-color, text-decoration-color, fill, stroke;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        transition-duration: 300ms;
      }
      
      div, section, article, nav, button, input, textarea {
         transition-property: background-color, border-color, color;
         transition-duration: 300ms;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #FDFBF7;
        border-left: 2px solid #1C1917;
      }
      .dark ::-webkit-scrollbar-track {
        background: #1c1917;
        border-left: 2px solid #57534e;
      }

      ::-webkit-scrollbar-thumb {
        background: #F97316;
        border: 2px solid #1C1917;
      }
      .dark ::-webkit-scrollbar-thumb {
        border: 2px solid #57534e;
      }
      
      ::-webkit-scrollbar-thumb:hover {
        background: #EA580C;
      }
      
      .paper-texture {
        background-color: #FDFBF7;
        background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
      }

      .dark .paper-texture {
        background-color: #1c1917;
        background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      }

      /* Neo-Brutalist Utilities */
      .neo-shadow {
        box-shadow: 5px 5px 0px 0px var(--shadow-color);
      }
      
      .neo-shadow-hover {
        transition: all 0.2s ease;
      }
      .neo-shadow-hover:hover {
        box-shadow: 2px 2px 0px 0px var(--shadow-color);
        transform: translate(3px, 3px);
      }

      .neo-input {
        border: 2px solid var(--border-color);
        box-shadow: 4px 4px 0px 0px #e5e5e5;
        transition: all 0.2s ease;
      }
      .dark .neo-input {
         box-shadow: 4px 4px 0px 0px #44403c;
      }
      .neo-input:focus {
        outline: none;
        box-shadow: 4px 4px 0px 0px #F97316;
      }
      .dark .neo-input:focus {
        box-shadow: 4px 4px 0px 0px #F97316;
      }

      /* Construction Striped Background */
      .bg-stripes {
        background-image: repeating-linear-gradient(
          45deg,
          rgba(0, 0, 0, 0.05),
          rgba(0, 0, 0, 0.05) 10px,
          transparent 10px,
          transparent 20px
        );
      }
      .dark .bg-stripes {
        background-image: repeating-linear-gradient(
          45deg,
          rgba(255, 255, 255, 0.05),
          rgba(255, 255, 255, 0.05) 10px,
          transparent 10px,
          transparent 20px
        );
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="paper-texture text-ink dark:text-stone-100 antialiased transition-colors duration-300 overflow-x-hidden">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
